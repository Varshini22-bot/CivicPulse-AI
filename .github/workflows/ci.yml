name: CivicPulse AI CI/CD Pipeline

on:
  push:
    branches: [ main, "phase-*" ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    name: Backend Tests & Security Audit
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: testpassword
          POSTGRES_DB: civicpulse_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install System Dependencies (libgl1 for OpenCV)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgl1 libglib2.0-0

      - name: Install CPU PyTorch & Torchvision
        run: |
          python -m pip install --upgrade pip
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu

      - name: Install Backend Dependencies
        run: |
          pip install -r backend/requirements.txt
          pip install pip-audit pytest-cov

      - name: Run Backend Test Suite with Coverage
        env:
          DATABASE_URL: sqlite:///./civicpulse.db
          POSTGRES_TEST_URL: postgresql://postgres:testpassword@localhost:5432/civicpulse_test_db
        run: |
          pytest backend/tests -v --cov=backend/app/services --cov=backend/app/ml --cov-report=term-missing --cov-fail-under=75

      - name: Run Security Audit (pip-audit)
        run: |
          pip-audit -r backend/requirements.txt --ignore-vuln CVE-FAKE-TEST-IGNORE

  frontend-tests:
    name: Frontend Tests, Lint & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        run: npm ci --prefix frontend

      - name: Run Linter (oxlint)
        run: npm run lint --prefix frontend

      - name: Run Unit & Component Tests (Vitest)
        run: npm test --prefix frontend

      - name: Build Production Assets
        run: npm run build --prefix frontend

      - name: Run Security Audit (npm audit)
        run: npm audit --prefix frontend --audit-level=high

  docker-lint:
    name: Dockerfile & Compose Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Docker Compose Configuration
        run: docker compose config
